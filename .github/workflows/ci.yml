name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:i18n
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    # Disposable PostgreSQL only: the integration tests TRUNCATE their database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_URL: postgresql://postgres@127.0.0.1:55432/postgres
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/hra_phase1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Prepare disposable test database (see backend/tests/README.md)
        run: |
          psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS;"
          psql "$PG_ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE hra_phase1_test;"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA auth; CREATE TABLE auth.users (id UUID PRIMARY KEY, email TEXT UNIQUE); CREATE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $$ SELECT NULL::UUID $$;'
          for f in supabase/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1.0"
      - run: pip install -e './backend[dev]'
      - run: pytest -q backend/tests

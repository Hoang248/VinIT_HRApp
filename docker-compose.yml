services:
  # Supabase Auth and PostgreSQL must already be running (locally or remotely).
  # The API starts its own PostgreSQL-polling worker; no Celery/Redis is needed.
  backend:
    build: ./backend
    env_file: .env
    # Bind to loopback by default; publish externally only behind a reviewed proxy.
    ports:
      - "${HRA_BACKEND_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - cv_storage:/app/storage
    environment:
      LOCAL_STORAGE_PATH: /app/storage
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${HRA_FRONTEND_BIND:-127.0.0.1}:3000:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  cv_storage:
